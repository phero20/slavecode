version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: ./infra/api.Dockerfile
    container_name: slavecode-api
    env_file:
      - ./api/.env
    ports:
      - "4000:3000"
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_PRETTY=true
    volumes:
      - ./data:/app/data
      - ./api/src:/app/api/src
    depends_on:
      - redis

  arena:
    build:
      context: .
      dockerfile: ./infra/arena.Dockerfile
    container_name: slavecode-worker
    env_file:
      - ./arena/.env
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_PRETTY=true
      - CLERK_PEM_PUBLIC_KEY=${CLERK_PEM_PUBLIC_KEY}
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: slavecode-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

